<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio Streaming & Live Chat</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --text: #f8fafc;
      --muted: #94a3b8;
      --error: #ef4444;
      --like: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Player Card */
    .player-card {
      background: var(--card);
      padding: 24px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .album-art-container {
      width: 140px;
      height: 140px;
      margin-bottom: 16px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
      background: #000;
    }

    .album-art {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .station-title {
      font-size: 1.5rem;
      margin-bottom: 4px;
    }

    .now-playing {
      color: var(--primary);
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 12px;
    }

    .station-status {
      color: #4ade80;
      font-size: 0.8rem;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(74, 222, 128, 0.1);
      padding: 4px 12px;
      border-radius: 20px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #4ade80;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    audio {
      width: 100%;
      border-radius: 8px;
      outline: none;
    }

    /* Comments Section */
    .comments-card {
      background: var(--card);
      padding: 24px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .comment-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .form-row input {
      flex: 1;
    }

    input, textarea {
      background: var(--bg);
      border: 1px solid #334155;
      color: var(--text);
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      width: 100%;
    }

    input:focus, textarea:focus {
      outline: 2px solid var(--primary);
      border-color: transparent;
    }

    .captcha-box {
      background: var(--bg);
      padding: 12px;
      border-radius: 8px;
      border: 1px dashed #334155;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .captcha-label {
      font-weight: 600;
      color: var(--primary);
      white-space: nowrap;
      user-select: none;
    }

    .captcha-box input {
      max-width: 100px;
      text-align: center;
    }

    button.btn-submit {
      background: var(--primary);
      color: #0f172a;
      font-weight: 600;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.btn-submit:hover {
      background: var(--primary-hover);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .comments-list {
      max-height: 380px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 4px;
    }

    .comment-item {
      background: var(--bg);
      padding: 12px 16px;
      border-radius: 8px;
      border-left: 3px solid var(--primary);
    }

    .comment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      margin-bottom: 6px;
    }

    .author-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .comment-author {
      font-weight: 600;
      color: var(--primary);
    }

    .user-badge {
      background: #334155;
      color: var(--muted);
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-weight: bold;
    }

    .comment-time {
      color: var(--muted);
      font-size: 0.75rem;
    }

    .comment-body {
      font-size: 0.95rem;
      word-break: break-word;
      margin-bottom: 8px;
    }

    .comment-footer {
      display: flex;
      justify-content: flex-end;
    }

    .like-btn {
      background: transparent;
      border: 1px solid #334155;
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .like-btn:hover {
      border-color: var(--like);
      color: var(--like);
    }

    .like-btn.liked {
      background: rgba(244, 63, 94, 0.15);
      border-color: var(--like);
      color: var(--like);
    }

    @media (max-width: 480px) {
      .form-row {
        flex-direction: column;
      }
      .captcha-box {
        flex-direction: column;
        align-items: stretch;
      }
      .captcha-box input {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Radio Player -->
    <div class="player-card">
      <!-- Fitur Album Art / Logo Stasiun -->
      <div class="album-art-container">
        <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&auto=format&fit=crop&q=80" alt="Album Art" class="album-art" id="albumArt">
      </div>

      <!-- Fitur Nama Stasiun & Program -->
      <h1 class="station-title" id="stationName">Indie Beats FM</h1>
      <p class="now-playing" id="nowPlaying">Playing: Non-Stop Hits & Chill Beats</p>

      <div class="station-status">
        <span class="status-dot"></span>
        <span>LIVE STREAMING</span>
      </div>

      <audio controls preload="none">
        <source src="https://radio.pelajarjurnalis.or.id/radio/;" type="audio/mpeg">
        Browser Anda tidak mendukung elemen audio.
      </audio>
    </div>

    <!-- Live Comments -->
    <div class="comments-card">
      <h2>Komentar Interaktif</h2>
      
      <form class="comment-form" id="commentForm">
        <div class="form-row">
          <input type="text" id="namaInput" placeholder="Nama Anda" required>
          <input type="email" id="emailInput" placeholder="Email (Privat & Unik)" required>
        </div>
        <textarea id="pesanInput" rows="3" placeholder="Tulis pesan..." required></textarea>
        
        <!-- Box Captcha Matematika -->
        <div class="captcha-box">
          <span class="captcha-label" id="captchaQuestion">Berapa 0 + 0?</span>
          <input type="number" id="captchaInput" placeholder="Hasil?" required>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Kirim Komentar</button>
      </form>

      <div class="comments-list" id="commentsList">
        <p style="text-align: center; color: var(--muted);">Memuat komentar...</p>
      </div>
    </div>
  </div>

  <script>
    // MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI SINI
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzoI3m5EAcayQptkr5N4ljxgMNrD_ifD-nF_tNPvA2M7RFkS2l4GXZ85D-wMvYgFjWn/exec';

    const commentForm = document.getElementById('commentForm');
    const namaInput = document.getElementById('namaInput');
    const emailInput = document.getElementById('emailInput');
    const pesanInput = document.getElementById('pesanInput');
    const submitBtn = document.getElementById('submitBtn');
    const commentsList = document.getElementById('commentsList');

    const captchaQuestion = document.getElementById('captchaQuestion');
    const captchaInput = document.getElementById('captchaInput');
    let captchaAnswer = 0;

    // Cache daftar komentar lokal & liked list
    let localLikedComments = JSON.parse(localStorage.getItem('radio_liked_ids') || '[]');

    function generateCaptcha() {
      const num1 = Math.floor(Math.random() * 10) + 1;
      const num2 = Math.floor(Math.random() * 10) + 1;
      captchaAnswer = num1 + num2;
      captchaQuestion.innerText = `Berapa ${num1} + ${num2}?`;
      captchaInput.value = '';
    }

    function loadSavedUser() {
      const savedName = localStorage.getItem('radio_user_name');
      const savedEmail = localStorage.getItem('radio_user_email');
      if (savedName) namaInput.value = savedName;
      if (savedEmail) emailInput.value = savedEmail;
    }

    // Mengambil komentar dari Google Sheets
    async function fetchComments() {
      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();
        
        if (!data || data.length === 0) {
          commentsList.innerHTML = '<p style="text-align: center; color: var(--muted);">Belum ada komentar.</p>';
          return;
        }

        commentsList.innerHTML = data.map(item => {
          const date = new Date(item.timestamp).toLocaleString('id-ID', {
            hour: '2-digit',
            minute: '2-digit',
            day: 'numeric',
            month: 'short'
          });
          
          const isLiked = localLikedComments.includes(item.id);
          
          return `
            <div class="comment-item">
              <div class="comment-header">
                <div class="author-wrapper">
                  <span class="comment-author">${escapeHtml(item.nama)}</span>
                  <span class="user-badge">${escapeHtml(item.userCode)}</span>
                </div>
                <span class="comment-time">${date}</span>
              </div>
              <div class="comment-body">${escapeHtml(item.pesan)}</div>
              <div class="comment-footer">
                <button class="like-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike(${item.id}, this)">
                  ❤️ <span class="like-count">${item.likes || 0}</span>
                </button>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        commentsList.innerHTML = '<p style="text-align: center; color: var(--error);">Gagal memuat komentar.</p>';
      }
    }

    // Fungsi Mengirimkan Like
    async function toggleLike(rowId, btnElement) {
      if (localLikedComments.includes(rowId)) return; // Mencegah spaming Like dari user yang sama

      const countSpan = btnElement.querySelector('.like-count');
      let currentLikes = parseInt(countSpan.innerText) || 0;
      
      // Update UI lokal secara cepat
      countSpan.innerText = currentLikes + 1;
      btnElement.classList.add('liked');
      
      localLikedComments.push(rowId);
      localStorage.setItem('radio_liked_ids', JSON.stringify(localLikedComments));

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: JSON.stringify({ action: 'like', rowId: rowId })
        });
      } catch (err) {
        console.error('Gagal mengirim Like:', err);
      }
    }

    // Kirim Komentar Baru
    commentForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const userAnswer = parseInt(captchaInput.value.trim(), 10);
      if (userAnswer !== captchaAnswer) {
        alert('Jawaban Captcha salah!');
        generateCaptcha();
        return;
      }

      const nama = namaInput.value.trim();
      const email = emailInput.value.trim();
      const pesan = pesanInput.value.trim();

      if (!nama || !email || !pesan) return;

      localStorage.setItem('radio_user_name', nama);
      localStorage.setItem('radio_user_email', email);

      submitBtn.disabled = true;
      submitBtn.innerText = 'Mengirim...';

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: JSON.stringify({ nama, email, pesan })
        });

        pesanInput.value = '';
        generateCaptcha();

        setTimeout(() => {
          fetchComments();
          submitBtn.disabled = false;
          submitBtn.innerText = 'Kirim Komentar';
        }, 1500);

      } catch (err) {
        alert('Gagal mengirim komentar.');
        submitBtn.disabled = false;
        submitBtn.innerText = 'Kirim Komentar';
      }
    });

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Inisialisasi awal
    generateCaptcha();
    loadSavedUser();
    fetchComments();
    setInterval(fetchComments, 10000); // Auto-refresh komentar tiap 10 detik
  </script>
</body>
</html>
