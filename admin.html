<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Radio Streaming</title>
  <style>
    :root {
      --bg: #0b141a;
      --card: #111b21;
      --primary: #00f2b9;
      --danger: #ff4d4d;
      --text: #e9edef;
      --muted: #8696a0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    .admin-card {
      background: var(--card);
      border: 1px solid rgba(0, 242, 185, 0.2);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }
    h2 { margin-top: 0; color: var(--primary); font-size: 1.2rem; }
    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin: 6px 0 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: #202c33;
      color: var(--text);
      box-sizing: border-box;
    }
    button {
      background: var(--primary);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }
    .btn-danger { background: var(--danger); color: #fff; width: auto; padding: 6px 12px; }
    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    #login-box { max-width: 360px; margin: 80px auto; text-align: center; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- LOGIN PIN ADMIN -->
  <div id="login-box" class="admin-card">
    <h2>🔒 Login Admin</h2>
    <input type="password" id="pinInput" placeholder="Masukkan PIN Admin">
    <button onclick="checkPin()">Masuk Panel</button>
  </div>

  <!-- DASHBOARD ADMIN CONTAINER -->
  <div id="dashboard" class="hidden">
    
  <!-- MODAL EDIT FOTO GALERI (DIPERBAIKI) -->
  <div id="editGalleryModal" class="hidden" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:2000; display:none; justify-content:center; align-items:center;">
    <div class="admin-card" style="width: 90%; max-width: 400px; background: #111b21;">
      <h2>✏️ Edit Foto Galeri</h2>
      <input type="hidden" id="editRowId">
      
      <label style="font-size: 0.8rem; color: var(--muted);">Judul Foto:</label>
      <input type="text" id="editTitle">
      
      <label style="font-size: 0.8rem; color: var(--muted);">URL Foto (Drive/Direct):</label>
      <input type="text" id="editUrl">
      
      <label style="font-size: 0.8rem; color: var(--muted);">Caption / Deskripsi:</label>
      <textarea id="editCaption" rows="3"></textarea>
      
      <button onclick="saveGalleryEdit()">Simpan Perubahan</button>
      <button onclick="closeEditModal()" style="background:#444; color:#fff; margin-top:0;">Batal</button>
    </div>
  </div>
    
    <!-- CONTAINER DAFTAR GALERI DI ADMIN DASHBOARD -->
    <div class="admin-card">
      <h2>🖼️ Kelola & Edit Galeri</h2>
      <!-- Tombol Refresh Galeri -->
      <button onclick="loadGalleryAdmin()" class="btn-admin-icon">
        <span>Refresh Galeri</span>
      </button>
      <div id="galleryAdminList">Memuat foto galeri...</div>
    </div>
    
    <!-- DASHBOARD KELOLA GALERI -->
    <div class="admin-card">
      <h2>🖼️ Tambah Foto Galeri</h2>
      <input type="text" id="gTitle" placeholder="Judul Foto / Acara">
      <input type="text" id="gUrl" placeholder="Link Foto (Google Drive / Direct URL)">
      <textarea id="gCaption" placeholder="Keterangan singkat..."></textarea>
      <button onclick="addGalleryItem()">+ Upload Ke Galeri</button>
    </div>

    <!-- DASHBOARD MODERASI CHAT -->
    <div class="admin-card">
      <h2>💬 Moderasi Chat (Hapus Pesan)</h2>
      <!-- Tombol Refresh Chat -->
      <button onclick="loadChatAdmin()" class="btn-admin-icon">
        <span>Refresh Chat</span>
      </button>
      <div id="chatAdminList">Memuat pesan...</div>
    </div>

  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby_O1fa98OjJqmah-AvmIRU_IrZOK7Yi6eH_7PBP9QJTjz_MwEeyB_wWN350u2Tey35/exec';
    const ADMIN_PIN = '@123456#'; // Ganti dengan PIN rahasia Anda

    async function checkPin() {
      const pinInput = document.getElementById('pinInput').value;
      if (!pinInput) return alert('Masukkan PIN Admin!');
    
      const payload = {
        action: 'checkPassword',
        password: pinInput
      };
    
      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
    
        const result = await res.json();
    
        if (result.status === 'success') {
          document.getElementById('login-box').classList.add('hidden');
          document.getElementById('dashboard').classList.remove('hidden');
          
          // Muat data admin setelah berhasil login
          loadChatAdmin();
          loadGalleryAdmin();
        } else if (result.status === 'wrong') {
          alert('PIN Admin Salah!');
        } else {
          alert(result.message || 'Gagal terhubung ke server.');
        }
      } catch (err) {
        alert('Terjadi kesalahan koneksi.');
      }
    }
    
    // Helper format link Google Drive
    function formatDriveUrl(url) {
      if (url.includes('drive.google.com')) {
        const idMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (idMatch && idMatch[1]) return `https://lh3.googleusercontent.com/d/${idMatch[1]}`;
      }
      return url;
    }

    // 1. TAMBAH FOTO GALERI
    async function addGalleryItem() {
      const title = document.getElementById('gTitle').value;
      let imageUrl = document.getElementById('gUrl').value;
      const caption = document.getElementById('gCaption').value;

      if (!title || !imageUrl) return alert('Judul dan URL Foto Wajib Diisi!');
      
      //imageUrl = formatDriveUrl(imageUrl);

      const payload = {
        action: 'addGallery',
        title: title,
        imageUrl: imageUrl,
        caption: caption
      };

      await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });

      alert('Foto Berhasil Ditambahkan ke Galeri!');
      document.getElementById('gTitle').value = '';
      document.getElementById('gUrl').value = '';
      document.getElementById('gCaption').value = '';
    }

    // 2. LOAD & MODERASI CHAT
    async function loadChatAdmin() {
      const container = document.getElementById('chatAdminList');
      container.innerHTML = 'Memuat...';

      const res = await fetch(SCRIPT_URL);
      const data = await res.json();
      
      container.innerHTML = '';
      data.reverse().forEach(item => {
        container.innerHTML += `
          <div class="list-item">
            <div>
              <strong>${item.nama}</strong>: ${item.pesan}
            </div>
            <button class="btn-danger" onclick="deleteChat(${item.id})">Hapus</button>
              <span>Hapus</span>
            </button>
          </div>
        `;
      });
    }

    // 3. HAPUS CHAT
    async function deleteChat(id) {
      if (!confirm('Yakin ingin menghapus pesan ini?')) return;

      await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'deleteChat', id: id })
      });

      alert('Pesan dihapus!');
      loadChatAdmin();
    }

    // 1. LOAD DAFTAR FOTO GALERI DI ADMIN
    async function loadGalleryAdmin() {
      const container = document.getElementById('galleryAdminList');
      container.innerHTML = 'Memuat...';
    
      try {
        const res = await fetch(SCRIPT_URL + '?action=gallery');
        const data = await res.json();
        
        container.innerHTML = '';
        if(!data || data.length === 0) {
          container.innerHTML = '<p style="color:var(--muted)">Belum ada foto di galeri.</p>';
          return;
        }
    
        data.forEach(item => {
          // escape teks quotes untuk fungsi onclick
          const safeTitle = (item.title || '').replace(/'/g, "\\'");
          const safeCaption = (item.caption || '').replace(/'/g, "\\'");
          const safeUrl = (item.imageUrl || '').replace(/'/g, "\\'");
    
          container.innerHTML += `
            <div class="list-item" style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
              <img src="${item.imageUrl}" style="width:50px; height:50px; object-fit:cover; border-radius:6px;">
              <div style="flex:1; overflow:hidden;">
                <strong style="font-size:0.9rem; display:block; text-overflow:ellipsis; white-space:nowrap; overflow:hidden;">${item.title}</strong>
                <small style="color:var(--muted)">${item.caption || '-'}</small>
              </div>
              <div style="display:flex; gap:5px;">
                <button style="width:auto; padding:6px 10px; font-size:0.75rem; background:#e2a03f;" 
                  onclick="openEditModal(${item.id}, '${safeTitle}', '${safeUrl}', '${safeCaption}')">Edit</button>
                <button class="btn-danger" style="font-size:0.75rem;" onclick="deleteGallery(${item.id})">Hapus</button>
              </div>
            </div>
          `;
        });
      } catch (err) {
        container.innerHTML = 'Gagal memuat galeri.';
      }
    }

    // BUKA MODAL EDIT (HANYA SAAT TOMBOL EDIT DIKLIK)
    function openEditModal(rowId, title, url, caption) {
      document.getElementById('editRowId').value = rowId;
      document.getElementById('editTitle').value = title;
      document.getElementById('editUrl').value = url;
      document.getElementById('editCaption').value = caption;
      
      const modal = document.getElementById('editGalleryModal');
      modal.classList.remove('hidden');
      modal.style.display = 'flex'; // Tampilkan flex saat diklik
    }
    
    // TUTUP MODAL EDIT
    function closeEditModal() {
      const modal = document.getElementById('editGalleryModal');
      modal.classList.add('hidden');
      modal.style.display = 'none'; // Sembunyikan total
    }
    
    // 3. SIMPAN HASIL EDIT GALERI KE GOOGLE SPREADSHEET
    async function saveGalleryEdit() {
      const rowId = document.getElementById('editRowId').value;
      const title = document.getElementById('editTitle').value;
      let imageUrl = document.getElementById('editUrl').value;
      const caption = document.getElementById('editCaption').value;
    
      if (!title || !imageUrl) return alert('Judul dan URL Foto tidak boleh kosong!');
    
      // Format link Google Drive jika dimasukkan URL Drive biasa
      //imageUrl = formatDriveUrl(imageUrl);
    
      const payload = {
        action: 'editGallery',
        rowId: rowId,
        title: title,
        imageUrl: imageUrl,
        caption: caption
      };
    
      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
    
        alert('Galeri Berhasil Diperbarui!');
        closeEditModal();
        loadGalleryAdmin(); // Reload daftar galeri admin
      } catch (err) {
        alert('Gagal menyimpan perubahan.');
      }
    }
    
    // 4. HAPUS FOTO GALERI
    async function deleteGallery(rowId) {
      if (!confirm('Yakin ingin menghapus foto galeri ini?')) return;
    
      const payload = {
        action: 'deleteGallery',
        rowId: rowId
      };
    
      await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      
      alert('Foto dihapus!');
      loadGalleryAdmin();
    }
  </script>
</body>
</html>
